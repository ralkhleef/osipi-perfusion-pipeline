services:
  osipi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: osipi-perfusion-pipeline:local
    container_name: osipi-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/backend:/app/src
      # Host paths are required when participant containers use the Docker socket.
      HOST_SUBMISSIONS_DIR: ${PWD}/submissions
      HOST_OUTPUTS_DIR: ${PWD}/data/outputs
      HOST_REFERENCE_DATA_DIR: ${PWD}/data/reference_data
    volumes:
      - ./data:/app/data
      - ./submissions:/app/submissions
      # The Configuration Manager saves and activates tested rule versions here.
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
