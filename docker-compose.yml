services:
  osipi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: osipi-perfusion-pipeline:local
    container_name: osipi-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/backend:/app/src
      # Docker-outside-of-Docker (DooD) path translation.
      # The backend runs inside a container but spawns docker run on the HOST
      # daemon via the socket mount. Volume paths in docker run -v must be
      # host-visible. These vars let docker_runner.py translate container paths
      # (/app/submissions/...) to the equivalent host paths before building
      # the -v arguments. ${PWD} is expanded by docker-compose on the host.
      HOST_SUBMISSIONS_DIR: ${PWD}/submissions
      HOST_OUTPUTS_DIR: ${PWD}/data/outputs
      HOST_REFERENCE_DATA_DIR: ${PWD}/data/reference_data
    volumes:
      - ./data:/app/data
      - ./submissions:/app/submissions
      # Challenge rules, so editing config/validation_rules.yaml takes effect on
      # `docker compose restart` rather than needing the image rebuilt. The
      # image still COPYs config/, so the application runs without this mount;
      # it only overlays the host copy. Read-only because nothing writes here —
      # uploaded scoring packages live under data/scoring/packages.
      # The rules are cached for the life of the process, so the restart is
      # what makes an edit visible, not the mount alone.
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
