[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osipi-perfusion-pipeline"
version = "0.1.0"
description = "Modular OSIPI perfusion MRI challenge pipeline."
requires-python = ">=3.10"
dependencies = [
    "nibabel>=3.0",
    "numpy>=1.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"osipi_pipeline.execution" = ["Dockerfile.example"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
