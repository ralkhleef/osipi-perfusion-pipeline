version: 1

defaults:
  challenge_type: dce
  scoring_map_type: Ktrans
  validation_mode: auto

limits:
  zip_max_bytes: 524288000
  extract_max_bytes: 2147483648
  extract_max_files: 10000

reporting:
  default_blinded: true
  percent_aggregation: voxel_weighted
  include_pdf_export: true

performance:
  # Applies to the small 3-D parameter maps, where threads measurably help:
  # four workers over sixteen real Ktrans maps is 2.5x faster than serial.
  #
  # It does NOT apply to large 4-D files. An earlier version of this comment
  # claimed decompression releases the GIL so more threads always help. That
  # is true of one big `decompress` call and false for the many small reads
  # nibabel actually makes: four threads over four real 1 GB concentration
  # curves measured 1.8x *slower* than reading them one at a time. The
  # validator now picks by file size, so large files are read serially however
  # this is set, and raising it cannot reintroduce that slowdown.
  #
  # Capped at 6 in code, and further capped by the CPU count, so setting this
  # higher than the machine has cores does nothing. Lower it if validation is
  # competing with something else for the machine.
  nifti_validation_workers: 6
  batch_validation_workers: 2
  validation_cache_enabled: true
  manifest_cache_enabled: true
  preview_cache_enabled: true
  # The analysis is what the report, every export and the frontend all ask
  # for, and on a real DCE submission it reads a gigabyte of 4-D data and
  # takes about a minute. Memoised on the submitted maps, the ground truth,
  # the masks and the configuration, so changing any of them recomputes and
  # changing none of them does not. Turn off to force a fresh read every time.
  analysis_cache_enabled: true

paths:
  output_map_subdirs:
    - results/maps
    - results
    - ''
  private_path_parts:
    - reference
    - references
    - ref
    - masks
    - mask
  mask_name_patterns:
    - mask
    - roi
    - gray
    - grey
    - white
    - gm
    - wm
  mask_label_rules:
    - label: gray matter
      patterns:
        - gray
        - grey
        - gm
    - label: white matter
      patterns:
        - white
        - wm
    - label: brain mask
      patterns:
        - brain
    # Before the generic `roi` rule: the first match wins, so a file named
    # lesion_roi_mask.nii.gz would otherwise be labelled "ROI" and a reader
    # could not tell which region a row referred to.
    # Matches the abbreviation the DCE challenge ships (Hipp_mask.nii.gz) and
    # nothing more. A plain `hipp` would swallow left_hippocampus.nii.gz and
    # right_hippocampus.nii.gz into one indistinguishable label; those names
    # already read well through the filename fallback and are left alone.
    - label: hippocampus
      patterns:
        - hipp_mask
    - label: lesion
      patterns:
        - lesion
        - tumour
        - tumor
    - label: ROI
      patterns:
        - roi

ingestion:
  skip_prefixes:
    - __MACOSX
    - __pycache__
  skip_names:
    - .DS_Store
    - Thumbs.db
    - desktop.ini
    - .gitkeep
  structural_subdirs:
    - input
    - inputs
    - result
    - results
    - output
    - outputs
    - reference
    - ref
    - references
    - masks
    - mask
    - maps
    - map
    - data
    - raw
    - processed
    - src
    - source
    - sources
    - code
    - scripts
    - logs
    - log
    - tmp
    - temp
    - docs
    - doc
    - analysis
