version: 1
default_challenge_type: dce
nifti_suffixes:
- .nii
- .nii.gz
metadata_suffixes:
- .json
- .yaml
- .yml
- .csv
- .tsv
readme_names:
- readme.md
- readme.txt
- readme
- sop.pdf
- metadata.json
code_file_names:
- dockerfile
- requirements.txt
- environment.yml
- main.py
- run.py
- setup.py
code_extensions:
- .py
- .sh
- .m
- .r
- .ipynb
- .jl
- .c
- .cpp
- .h
- .hpp
code_folder_names:
- scripts
- code
- src
map_types:
  cbf:
    display: CBF
    label: Cerebral blood flow
    units: mL/100g/min
    dimensions: 3
    patterns:
    - cbf
    - cerebral_blood_flow
    - cerebralbloodflow
    - perfmap
    - perfusion
    - perf
  att:
    display: ATT
    label: Arterial transit time
    units: seconds
    dimensions: 3
    patterns:
    - att
    - arterial_transit_time
    - arterialtransittime
    - arrivaltransittime
    - attmap
  ktrans:
    display: Ktrans
    label: Volume transfer constant
    units: min^-1
    dimensions: 3
    patterns:
    - ktrans
    - k-trans
    - k_trans
    - transfer_constant
  ve:
    display: ve
    label: Extravascular extracellular volume fraction
    units: null
    dimensions: 3
    patterns:
    - ve
    - v_e
  kep:
    display: Kep
    label: Rate constant
    units: null
    dimensions: 3
    patterns:
    - kep
    - k_ep
    - rate_constant
  vp:
    display: Vp
    label: Plasma volume fraction
    units: null
    dimensions: 3
    patterns:
    - vp
    - v_p
    - plasma_volume
  cbv:
    display: CBV
    label: Cerebral blood volume
    units: null
    dimensions: 3
    patterns:
    - cbv
    - cerebral_blood_volume
  mtt:
    display: MTT
    label: Mean transit time
    units: null
    dimensions: 3
    patterns:
    - mtt
    - mean_transit_time
artifact_types:
  modelled_st:
    role: fitted_signal
    label: Modelled signal-time curve
    dimensions: 4
    suffixes:
    - .nii
    - .nii.gz
    patterns:
    - modelled_st
    - modeled_st
    - fitted_signal
    # The DCE challenge lead's synthetic submission names the fitted
    # concentration curve Ct.nii.gz. Matching is case insensitive.
    - ct
  measured_st:
    role: measured_signal
    label: Measured signal-time curve
    dimensions: 4
    suffixes:
    - .nii
    - .nii.gz
    patterns:
    - measured_st
    - measured_signal
    - observed_st
  methods:
    role: methods
    label: Methods document
    suffixes:
    - .docx
    - .txt
    patterns:
    - methods
    - methodology
challenges:
  dce:
    label: DCE
    description: Dynamic contrast enhanced MRI
    expected_maps:
    - ktrans
    - kep
    - vp
    required_maps:
    - ktrans
    optional_maps:
    - vp
    - ve
    - kep
    # "methods" was required here until the challenge leads said it is not
    # needed for the internal runs the challenge is doing now. That is their
    # call to make, so the requirement is relaxed rather than argued with, and
    # this is the one line to change when it becomes a real requirement again:
    # add `- methods` back to the list below.
    #
    # Relaxed is not ignored. The upload form asks whether a methods document
    # is included, the answer is recorded with the submission and shown in the
    # report, and a submitter who says yes and sends none still gets an error.
    # So dropping it here removes the blanket demand, not the accounting.
    required_artifacts:
    - modelled_st
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - ktrans
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
      signal_rss:
        enabled: true
        modelled_artifact: modelled_st
        measured_artifact: measured_st
    grouped_statistics:
      enabled: true
      axes:
      - inter_repeat
      - inter_site
      - inter_participant
      source: roi_median
      minimum_group_size: 2
      # ICC is implemented for all six Shrout & Fleiss models; which one
      # applies is a scientific decision, so no model is applied by default.
      # `none` leaves ICC reported as "not configured" exactly as before.
      # Set `model` to one of icc1_1, icc2_1, icc3_1, icc1_k, icc2_k, icc3_k
      # once the challenge leads have chosen:
      #   model 1  each participant measured by a different set of sessions
      #   model 2  same sessions for everyone, absolute agreement, generalises
      #   model 3  same sessions for everyone, consistency, fixed sessions
      #   _1 / _k  reliability of one measurement, or of the mean of k
      # `axes` picks which factor plays the session role; participants are the
      # targets, so inter_participant is not a valid ICC axis.
      # `confidence_level: null` reports the estimate with no interval.
      icc:
        model: none
        axes:
        - inter_repeat
        confidence_level: 0.95
    filename_identity_patterns:
    - ^(?P<dataset>Synthetic|Clinical)_P(?P<participant>\d+)_Visit(?P<repeat>\d+)_Site(?P<site>\d+)$
    - ^(?P<dataset>Synthetic|Clinical)_P(?P<participant>\d+)_Visit(?P<repeat>\d+)$
    datasets:
      synthetic:
        participants: null
        repeats: 2
        sites: 3
      clinical:
        participants: 5
        repeats: 2
        sites: 1
    keywords:
    - ktrans
    - kep
    - vp
    - dce
    - dynamic contrast enhanced
    # Structural BIDS checks: layout and naming only, not the full BIDS
    # specification. Reports findings as warnings; set severity to error to
    # block, or require_layout to insist that every submission uses BIDS.
    bids_validation:
      enabled: true
      severity: warning
      require_layout: false
  asl:
    label: ASL
    description: Arterial spin labeling MRI
    expected_maps:
    - cbf
    - att
    required_maps:
    - cbf
    - att
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - cbf
        - att
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
      # The 4-D fitted-model comparison: participants submit what they fitted
      # to get CBF and ATT, and it is compared voxel by voxel against the
      # ground-truth 4-D ASL signal. The analysis is challenge-generic; this
      # block is all that turns it on.
      #
      # It stays inert until the files exist, so enabling it early costs
      # nothing: a submission with no `modelled_st` reports
      # `modelled_signal_not_available` rather than failing. To make the 4-D
      # model mandatory, add `modelled_st` to `required_artifacts` below.
      signal_rss:
        enabled: true
        modelled_artifact: modelled_st
        measured_artifact: measured_st
    # Grouping needs identity, not a challenge-specific filename convention:
    # `identity_parser` resolves participant/repeat/site from directories
    # (sub-01/ses-2/, Participant003/Site1/Repeat2/) and from explicit prefixed
    # filename tokens (sub-004_ses-2_site-3_) for any challenge. Scans whose
    # identity cannot be resolved are skipped rather than merged, and a group
    # with only one scan is reported as `too_few_scans`, so enabling this on a
    # submission that carries no identity produces nothing rather than nonsense.
    # `datasets` below is still unset for ASL: the expected cohort grid is a
    # separate organiser decision and completeness, not grouping, depends on it.
    grouped_statistics:
      enabled: true
      axes:
      - inter_repeat
      - inter_site
      - inter_participant
      source: roi_median
      minimum_group_size: 2
      # ICC is implemented for all six Shrout & Fleiss models; which one
      # applies is a scientific decision, so no model is applied by default.
      # `none` leaves ICC reported as "not configured" exactly as before.
      # Set `model` to one of icc1_1, icc2_1, icc3_1, icc1_k, icc2_k, icc3_k
      # once the challenge leads have chosen:
      #   model 1  each participant measured by a different set of sessions
      #   model 2  same sessions for everyone, absolute agreement, generalises
      #   model 3  same sessions for everyone, consistency, fixed sessions
      #   _1 / _k  reliability of one measurement, or of the mean of k
      # `axes` picks which factor plays the session role; participants are the
      # targets, so inter_participant is not a valid ICC axis.
      # `confidence_level: null` reports the estimate with no interval.
      icc:
        model: none
        axes:
        - inter_repeat
        confidence_level: 0.95
    keywords:
    - cbf
    - att
    - asl
    - arterial spin labeling
    optional_maps: []
    required_artifacts: []
    code_execution_required: false
    # Advisory, and only for submissions that are already BIDS-shaped:
    # `require_layout: false` means a folder with no dataset_description.json
    # and no sub-<label> directory is left alone rather than reported as a
    # broken BIDS dataset, because it is not claiming to be one. Raise
    # `severity` to `error`, or set `require_layout: true`, when the challenge
    # decides to require the layout of every participant.
    bids_validation:
      enabled: true
      severity: warning
      require_layout: false
  dsc:
    label: DSC
    description: Dynamic susceptibility contrast MRI
    expected_maps:
    - cbv
    - cbf
    - mtt
    required_maps:
    - cbv
    - cbf
    - mtt
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - cbv
        - cbf
        - mtt
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
    grouped_statistics:
      enabled: true
      axes:
      - inter_repeat
      - inter_site
      - inter_participant
      source: roi_median
      minimum_group_size: 2
      # ICC is implemented for all six Shrout & Fleiss models; which one
      # applies is a scientific decision, so no model is applied by default.
      # `none` leaves ICC reported as "not configured" exactly as before.
      # Set `model` to one of icc1_1, icc2_1, icc3_1, icc1_k, icc2_k, icc3_k
      # once the challenge leads have chosen:
      #   model 1  each participant measured by a different set of sessions
      #   model 2  same sessions for everyone, absolute agreement, generalises
      #   model 3  same sessions for everyone, consistency, fixed sessions
      #   _1 / _k  reliability of one measurement, or of the mean of k
      # `axes` picks which factor plays the session role; participants are the
      # targets, so inter_participant is not a valid ICC axis.
      # `confidence_level: null` reports the estimate with no interval.
      icc:
        model: none
        axes:
        - inter_repeat
        confidence_level: 0.95
    keywords:
    - cbv
    - cbf
    - mtt
    - dsc
    - dynamic susceptibility contrast
    bids_validation:
      enabled: true
      severity: warning
      require_layout: false
