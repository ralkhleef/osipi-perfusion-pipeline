version: 1
default_challenge_type: dce
nifti_suffixes:
- .nii
- .nii.gz
metadata_suffixes:
- .json
- .yaml
- .yml
- .csv
- .tsv
readme_names:
- readme.md
- readme.txt
- readme
- sop.pdf
- metadata.json
code_file_names:
- dockerfile
- requirements.txt
- environment.yml
- main.py
- run.py
- setup.py
code_extensions:
- .py
- .sh
- .m
- .r
- .ipynb
- .jl
- .c
- .cpp
- .h
- .hpp
code_folder_names:
- scripts
- code
- src
map_types:
  cbf:
    display: CBF
    label: Cerebral blood flow
    units: mL/100g/min
    dimensions: 3
    patterns:
    - cbf
    - cerebral_blood_flow
    - cerebralbloodflow
    - perfmap
    - perfusion
    - perf
  att:
    display: ATT
    label: Arterial transit time
    units: seconds
    dimensions: 3
    patterns:
    - att
    - arterial_transit_time
    - arterialtransittime
    - arrivaltransittime
    - attmap
  ktrans:
    display: Ktrans
    label: Volume transfer constant
    units: min^-1
    dimensions: 3
    patterns:
    - ktrans
    - k-trans
    - k_trans
    - transfer_constant
  ve:
    display: ve
    label: Extravascular extracellular volume fraction
    units: null
    dimensions: 3
    patterns:
    - ve
    - v_e
  kep:
    display: Kep
    label: Rate constant
    units: null
    dimensions: 3
    patterns:
    - kep
    - k_ep
    - rate_constant
  vp:
    display: Vp
    label: Plasma volume fraction
    units: null
    dimensions: 3
    patterns:
    - vp
    - v_p
    - plasma_volume
  cbv:
    display: CBV
    label: Cerebral blood volume
    units: null
    patterns:
    - cbv
    - cerebral_blood_volume
  mtt:
    display: MTT
    label: Mean transit time
    units: null
    patterns:
    - mtt
    - mean_transit_time
artifact_types:
  modelled_st:
    role: fitted_signal
    label: Modelled signal-time curve
    dimensions: 4
    suffixes:
    - .nii
    - .nii.gz
    patterns:
    - modelled_st
    - modeled_st
    - fitted_signal
  measured_st:
    role: measured_signal
    label: Measured signal-time curve
    dimensions: 4
    suffixes:
    - .nii
    - .nii.gz
    patterns:
    - measured_st
    - measured_signal
    - observed_st
  methods:
    role: methods
    label: Methods document
    suffixes:
    - .docx
    - .txt
    patterns:
    - methods
    - methodology
challenges:
  dce:
    label: DCE
    description: Dynamic contrast enhanced MRI
    expected_maps:
    - ktrans
    - kep
    - vp
    required_maps:
    - ktrans
    optional_maps:
    - vp
    - ve
    - kep
    required_artifacts:
    - modelled_st
    - methods
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - ktrans
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
      signal_rss:
        enabled: true
        modelled_artifact: modelled_st
        measured_artifact: measured_st
    grouped_statistics:
      enabled: true
      axes:
      - inter_repeat
      - inter_site
      - inter_participant
      source: roi_median
      minimum_group_size: 2
    filename_identity_patterns:
    - ^(?P<dataset>Synthetic|Clinical)_P(?P<participant>\d+)_Visit(?P<repeat>\d+)_Site(?P<site>\d+)$
    - ^(?P<dataset>Synthetic|Clinical)_P(?P<participant>\d+)_Visit(?P<repeat>\d+)$
    datasets:
      synthetic:
        participants: null
        repeats: 2
        sites: 3
      clinical:
        participants: 5
        repeats: 2
        sites: 1
    keywords:
    - ktrans
    - kep
    - vp
    - dce
    - dynamic contrast enhanced
    # Structural BIDS checks: layout and naming only, not the full BIDS
    # specification. Off by default. Turning it on reports findings as
    # warnings; set severity to error to block, or require_layout to insist
    # that every submission uses BIDS at all.
    bids_validation:
      enabled: false
      severity: warning
      require_layout: false
  asl:
    label: ASL
    description: Arterial spin labeling MRI
    expected_maps:
    - cbf
    - att
    required_maps:
    - cbf
    - att
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - cbf
        - att
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
    keywords:
    - cbf
    - att
    - asl
    - arterial spin labeling
    optional_maps: []
    required_artifacts: []
    code_execution_required: false
  dsc:
    label: DSC
    description: Dynamic susceptibility contrast MRI
    expected_maps:
    - cbv
    - cbf
    - mtt
    required_maps:
    - cbv
    - cbf
    - mtt
    analysis:
      roi_descriptive:
        enabled: true
        map_types:
        - cbv
        - cbf
        - mtt
        report_metrics:
        - mean
        - median
        - standard_deviation
        - range
        - coefficient_of_variation
    keywords:
    - cbv
    - cbf
    - mtt
    - dsc
    - dynamic susceptibility contrast
